<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Register — Ultra Dash</title>
<style>
  body { background:#141414; color:#e8e8e8; font-family:system-ui,sans-serif; max-width:480px; margin:2rem auto; padding:0 1rem; }
  .card { background:#1f1f1f; border-radius:10px; padding:1.25rem; margin-bottom:1.25rem; }
  label { display:block; margin:.75rem 0 .25rem; color:#999; }
  input { width:100%; box-sizing:border-box; background:#141414; color:#e8e8e8; border:1px solid #333; border-radius:6px; padding:.5rem; font-size:1rem; }
  button { background:#4dabf7; border:none; padding:.5rem 1rem; border-radius:6px; cursor:pointer; font-size:1rem; color:#111; margin-top:1rem; }
  .flag { color:#ff8787; } .muted { color:#999; }
  a { color:#4dabf7; }
</style>
</head>
<body>
<h1>🏃 Ultra Dash</h1>
<div class="card">
  <h2>Create an account</h2>
  {% if error %}<p class="flag">{{ error }}</p>{% endif %}
  <form action="/register" method="post">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required minlength="8">
    <button type="submit">Register</button>
  </form>
  <p class="muted">Already have an account? <a href="/login">Log in</a></p>
</div>
</body>
</html>
